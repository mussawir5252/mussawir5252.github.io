<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Closed &middot; Musawir Abrar</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;1,9..144,300&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .closed {
      min-height: 100svh;
      display: grid; place-items: center;
      padding: var(--gutter);
      text-align: center;
    }
    .closed__sign {
      display: inline-block;
      padding: 2rem 2.5rem;
      border: 1px solid #c6bca7;
      background: #f2ede2; color: #1c1a17;
      box-shadow: 0 30px 60px -40px rgba(0,0,0,0.5);
      transform: rotate(-1.2deg);
      max-width: 26rem;
    }
    .closed__line {
      font-family: var(--mono); font-size: 0.9rem; letter-spacing: 0.12em; text-transform: uppercase;
      color: #1c1a17; margin: 0 0 0.6rem;
    }
    .closed__line--big { font-size: clamp(1.4rem, 5vw, 2rem); letter-spacing: 0.08em; margin-bottom: 1rem; }
    .closed__note {
      font-family: var(--serif); font-style: italic; font-weight: 300;
      color: #7a7468; margin: 1.4rem 0 0; font-size: 0.95rem;
    }
    .closed__back {
      display: inline-block; margin-top: 2rem;
      font-family: var(--mono); font-size: 0.8rem; letter-spacing: 0.08em; text-transform: uppercase;
      border-bottom: 1px solid var(--amber); padding-bottom: 0.15rem;
    }
    .closed__back:hover { color: var(--amber); }
  </style>
</head>
<body>
  <main class="closed">
    <div>
      <div class="closed__sign" role="img" aria-label="A handwritten sign on a glass door reading: Closed for the long weekend. Happy 4th!">
        <p class="closed__line closed__line--big">Closed for the<br>long weekend</p>
        <p class="closed__line">Happy 4th!</p>
        <p class="closed__note">This page is not here. The pawn shop was not open either.</p>
      </div>
      <br>
      <a class="closed__back" href="/">Back to the waiting room</a>
    </div>
  </main>
</body>
</html>
